# ПР5: локальна «хмара»: MQTT, Node-RED, InfluxDB, Grafana, S3-архів, TimescaleDB
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]

  nodered:
    build: ./nodered            # образ Node-RED + node-red-contrib-influxdb
    ports: ["1880:1880"]
    volumes: ["nodered-data:/data"]
    depends_on: [mosquitto, influxdb]

  influxdb:
    image: influxdb:2.7
    ports: ["8086:8086"]
    volumes: ["influx-data:/var/lib/influxdb2"]
    # організація, bucket і токен створюються при першому запуску
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: kpi
      DOCKER_INFLUXDB_INIT_BUCKET: solar
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      PG_PASSWORD: ${PG_PASSWORD}
    volumes:
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
      - "grafana-data:/var/lib/grafana"
    depends_on: [influxdb]

  # --- Завдання 4: холодне сховище (S3) ---
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -s3 -dir=/data"   # без -s3.config S3 працює без ключів (локально - ок)
    ports: ["8333:8333"]               # S3 API
    volumes: ["seaweed-data:/data"]

  # --- Завдання 5: реляційна БД з розширенням для часових рядів ---
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: solar
    volumes:
      - "./timescale/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
      - "ts-data:/home/postgres/pgdata"

volumes:
  nodered-data:
  influx-data:
  grafana-data:
  seaweed-data:
  ts-data:
